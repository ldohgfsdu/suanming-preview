# Suanming Preview CI
# 单一真值源：所有本地/CI 门禁都走 scripts/run-gate.mjs，避免两套流程漂移。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (项目固定 18.20.4)
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.4
          cache: npm

      - name: 安装依赖（锁文件可复现安装）
        run: npm ci

      - name: 统一门禁
        shell: bash
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee gate.log

      - name: 保留门禁日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 在 PR 更新失败诊断
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- suanming-gate-diagnostic -->';
            let log = 'gate.log 未生成';
            if (fs.existsSync('gate.log')) log = fs.readFileSync('gate.log', 'utf8');
            const body = `${marker}\n### CI 门禁失败诊断\n\n\`\`\`text\n${log.slice(-12000)}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const old = comments.data.find((c) => c.body && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: 环境指纹
        if: always()
        run: |
          node -e "console.log('NODE=' + process.version); console.log('INTL_LOCALE=' + process.env.LANG); console.log('TZ=' + process.env.TZ)"
          npx tsc -v
