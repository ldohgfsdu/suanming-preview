# Suanming Preview CI
# 单一真值源：所有本地/CI 门禁都走 scripts/run-gate.mjs，避免两套流程漂移。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (项目固定 18.20.4)
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.4
          cache: npm

      - name: 安装依赖（锁文件可复现安装）
        run: npm ci

      - name: 统一门禁
        run: npm run gate

      - name: 环境指纹
        run: |
          node -e "console.log('NODE=' + process.version); console.log('INTL_LOCALE=' + process.env.LANG); console.log('TZ=' + process.env.TZ)"
          npx tsc -v
